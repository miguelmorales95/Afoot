# Daily event import: fetches each active venue's events page (with a real browser for pages that
# load their calendars with scripts), has Claude Haiku pull out the events, and saves them.
# Runs here rather than on Vercel because Vercel's functions can't run a browser and stop after
# 5 minutes. Needs three repository secrets (Settings → Secrets and variables → Actions):
#   NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, ANTHROPIC_API_KEY
# Run it by hand from the Actions tab ("Run workflow"), optionally for one venue.
name: Ingest events

on:
  schedule:
    - cron: "0 9 * * *" # 2 a.m. in LA (1 a.m. in winter)
  workflow_dispatch:
    inputs:
      venue:
        description: "One venue's slug (empty for all active venues)"
        required: false
        default: ""

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Ingest
        run: npm run ingest -- ${VENUE:+"$VENUE"}
        env:
          VENUE: ${{ inputs.venue }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER: anthropic
